version: "3.1"

rules:
  # ===============================
  # BASIC INTENTS
  # ===============================

  - rule: Say I am a bot anytime user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Initial greet
    steps:
      - intent: greet
      - action: utter_greet

  # ===============================
  # FORM ACTIVATION
  # ===============================

  - rule: Activate car details form
    condition:
      - active_loop: null
    steps:
      - intent: inform
      - action: car_details_form
      - active_loop: car_details_form

  # ===============================
  # FORM SUBMISSION
  # ===============================

  - rule: After form submission
    condition:
      - active_loop: car_details_form
    steps:
      - action: car_details_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: utter_slots_values

  - rule: Confirm and predict price
    steps:
      - intent: affirm
      - action: action_predict_car_price

  - rule: Deny and clear slots after confirmation
    steps:
      - intent: deny
      - action: action_clear_slots

  # ===============================
  # INTERRUPTIONS DURING FORM
  # ===============================

  - rule: Bot challenge during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: bot_challenge
      - action: utter_iamabot
      - action: car_details_form
      - active_loop: car_details_form

  - rule: Stop during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_clear_slots
      - action: utter_goodbye

  - rule: Goodbye during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: goodbye
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_clear_slots
      - action: utter_goodbye

  # ===============================
  # STOP / GOODBYE OUTSIDE FORM
  # ===============================

  - rule: Stop during normal flow
    condition:
      - active_loop: null
    steps:
      - intent: stop
      - action: action_clear_slots
      - action: utter_goodbye

  - rule: Goodbye during normal flow
    condition:
      - active_loop: null
    steps:
      - intent: goodbye
      - action: action_clear_slots
      - action: utter_goodbye

  # ===============================
  # NLU FALLBACK
  # ===============================

  - rule: Fallback outside form
    steps:
      - intent: nlu_fallback
      - action: utter_please_rephrase

  - rule: Fallback during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: nlu_fallback
      - action: utter_please_rephrase
      - action: car_details_form
      - active_loop: car_details_form

  # ===============================
  # SHAP / EXPLANATION
  # ===============================

  - rule: Ask SHAP during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: ask_shap
      - action: action_max_contribution
      - action: car_details_form
      - active_loop: car_details_form

  - rule: Ask SHAP outside form
    condition:
      - active_loop: null
    steps:
      - intent: ask_shap
      - action: action_max_contribution

  # ===============================
  # GENERAL INFORMATION
  # ===============================

  - rule: Mileage info
    condition:
      - active_loop: null
    steps:
      - intent: ask_mileage
      - action: utter_mileage_info

  - rule: Mileage info during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: ask_mileage
      - action: utter_mileage_info
      - action: car_details_form
      - active_loop: car_details_form

  - rule: Value calculation info
    condition:
      - active_loop: null
    steps:
      - intent: ask_value_calculation
      - action: utter_value_calculation_info

  - rule: Value calculation info during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: ask_value_calculation
      - action: utter_value_calculation_info
      - action: car_details_form
      - active_loop: car_details_form

  - rule: Engine capacity info
    condition:
      - active_loop: null
    steps:
      - intent: ask_engine_capacity
      - action: utter_engine_capacity_info

  - rule: Engine capacity info during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: ask_engine_capacity
      - action: utter_engine_capacity_info
      - action: car_details_form
      - active_loop: car_details_form

  - rule: Maximum power info
    condition:
      - active_loop: null
    steps:
      - intent: ask_maximum_power
      - action: utter_maximum_power_info

  - rule: Maximum power info during form
    condition:
      - active_loop: car_details_form
    steps:
      - intent: ask_maximum_power
      - action: utter_maximum_power_info
      - action: car_details_form
      - active_loop: car_details_form
